# Kazarov project configuration for Chronicle Two. Sourced by tools/kazarov/scripts/kazarov.
# shellcheck shell=bash
# shellcheck disable=SC2034  # every variable here is read by the driver
KZ_PROJECT=chronicletwo
KZ_CONFIGS=(ps2-pal linux-x64 linux-x64-release macos-arm64 macos-arm64-release windows-x64 windows-x64-release)
KZ_DEFAULT_BUILD=ps2-pal
KZ_DEFAULT_RUN=ps2-pal
KZ_DEFAULT_RUN_LINUX=linux-x64-release
KZ_DEFAULT_BUILD_DARWIN=macos-arm64-release
KZ_DEFAULT_RUN_DARWIN=macos-arm64-release
KZ_DEFAULT_BUILD_WINDOWS=windows-x64-release
KZ_DEFAULT_RUN_WINDOWS=windows-x64-release
KZ_WINDOWS_HOST_SCRIPT=tools/windows/kazarov.ps1
KZ_WINDOWS_CONFIGS="windows-x64 windows-x64-release windows"
KZ_CONTAINER_CONFIGS="ps2 pal ps2-pal linux linux-x64 linux-x64-release linux-x64-debug macos macos-arm64 macos-arm64-release"
KZ_ENV_PASS=(SATANSFIDDLE SATANSFIDDLE_CONFIG)

# Names a configuration and sets how it is built and run. Returns 1 for an unknown name.
kz_config() {
    case $1 in
        ps2-pal|ps2|pal)
            KZ_CONFIG=ps2-pal
            KZ_WHERE=container
            KZ_BUILD_DIR=build/pal
            KZ_CMAKE_ARGS=(-DPLATFORM=PS2)
            KZ_SETUP_TARGETS=(setup)
            KZ_SETUP_STAMP=ps2/asm/pal.split-stamp
            KZ_BUILD_TARGETS=(build ctx objdiff)
            KZ_RUN_TARGETS=(iso)
            KZ_LOCKS=(ps2-pal)
            KZ_REQUIRE_ANY=("rom/pal/Dark Chronicle (PAL).iso" rom/pal/extracted/iso/SCES_511.90)
            KZ_REQUIRE_MESSAGE="kazarov: ps2-pal needs rom/pal/Dark Chronicle (PAL).iso or rom/pal/extracted/iso/SCES_511.90"
            KZ_RUN_ISO="build/pal/Dark Chronicle (PAL Build).iso" ;;
        linux|linux-x64-release)
            KZ_CONFIG=linux-x64-release
            KZ_WHERE=container
            KZ_PRESET=linux-x64-release
            KZ_BUILD_DIR=port/build/pc-release
            KZ_BUILD_TARGETS=(darkchronicle darkchronicle_tests dc2data dc2data_bridge_test)
            KZ_RUN_TARGETS=(all)
            KZ_RUN_OS=Linux
            KZ_RUN_EXE=$KZ_BUILD_DIR/darkchronicle ;;
        linux-x64-debug|linux-x64)
            KZ_CONFIG=linux-x64
            KZ_WHERE=container
            KZ_PRESET=linux-x64
            KZ_BUILD_DIR=port/build/pc
            KZ_BUILD_TARGETS=(darkchronicle darkchronicle_tests dc2data dc2data_bridge_test)
            KZ_RUN_TARGETS=(all)
            KZ_RUN_OS=Linux
            KZ_RUN_EXE=$KZ_BUILD_DIR/darkchronicle ;;
        macos|macos-arm64-release)
            KZ_CONFIG=macos-arm64-release
            KZ_WHERE=host
            KZ_HOST_OS=Darwin
            KZ_PRESET=macos-arm64-release
            KZ_BUILD_DIR=port/build/macos-arm64-release
            KZ_BUILD_TARGETS=(darkchronicle darkchronicle_tests dc2data dc2data_bridge_test)
            KZ_RUN_OS=Darwin
            KZ_RUN_EXE=$KZ_BUILD_DIR/darkchronicle ;;
        macos-arm64)
            KZ_CONFIG=macos-arm64
            KZ_WHERE=host
            KZ_HOST_OS=Darwin
            KZ_PRESET=macos-arm64
            KZ_BUILD_DIR=port/build/macos-arm64
            KZ_BUILD_TARGETS=(darkchronicle darkchronicle_tests dc2data dc2data_bridge_test)
            KZ_RUN_OS=Darwin
            KZ_RUN_EXE=$KZ_BUILD_DIR/darkchronicle ;;
        windows|windows-x64-release)
            KZ_CONFIG=windows-x64-release
            KZ_WHERE=windows ;;
        windows-x64)
            KZ_CONFIG=windows-x64
            KZ_WHERE=windows ;;
        *) return 1 ;;
    esac
    return 0
}

# Reports progress after a default build.
kz_after_build() {
    case $KZ_CONFIG in
        ps2-*) python3 scripts/build/progress_report.py ;;
    esac
}

# The macOS builds link the minimal LGPL FFmpeg built on the host; kz-ffmpeg skips itself when its stamp is current.
kz_before_build() {
    case $KZ_CONFIG in
        macos-*) "$KZ_ROOT/scripts/build/kz-ffmpeg" --out .kazarov/ffmpeg/darwin-arm64 ;;
    esac
}

# Checks the rebuilt executable against retail; a mismatch is reported and the run goes on.
kz_after_run_build() {
    case $KZ_CONFIG in
        ps2-*)
            BUILD_DIR=build/pal python3 scripts/build/verify.py -c || echo "The build does not match retail; booting it anyway." >&2 ;;
    esac
}

# Extracts the PAL game data for the port. The source is
# the disc image, or the extracted disc directory without one; with neither, an existing port/run/data.zip is used,
# and otherwise the game starts without data and its file loads fail.
# The game holds port/run/data.zip under a shared lock while it runs, so another configuration's extraction waits for it.
kz_before_launch() {
    case $KZ_CONFIG in
        linux-*|macos-*) ;;
        *) return 0 ;;
    esac
    # Script-run settings, saves, screenshots and renderer cache are confined to the ignored run tree.
    # A directly launched executable still uses its normal per-user save directory.
    KZ_LAUNCH_ARGS=(--run-dir "$KZ_PROJECT_ROOT/port/run")
    # Script runs log at debug to the console (docs/LOGGING.md); a DC2_LOG of the user's own still wins.
    export DC2_LOG="${DC2_LOG:-debug}"
    # dc2data takes <game-root>/data and publishes <game-root>/data.zip beside data.json.
    local data_root="$KZ_PROJECT_ROOT/port/run/data"
    local data_archive="$KZ_PROJECT_ROOT/port/run/data.zip"
    # The retail image by name, else any disc image in rom/pal, else the PS2 build's extracted disc.
    local source=rom/pal/"Dark Chronicle (PAL).iso"
    local images=(rom/pal/*.iso)
    if [ ! -e "$source" ]; then
        source=${images[0]}
    fi
    if [ ! -e "$source" ]; then
        source=rom/pal/extracted/iso
    fi
    local lock=(--lock .kazarov/locks/port-data.lock)
    if [ ! -e "$source" ]; then
        if [ ! -f "$data_archive" ]; then
            echo "kazarov: no PAL disc found; the game starts without data and its file loads fail" >&2
            return 0
        fi
        mkdir -p .kazarov/locks
        "$KZ_ROOT/scripts/lib/kz-lock" --shared "${lock[@]}" -- "$KZ_BUILD_DIR/dc2data" check "$data_root" || {
            echo "kazarov: existing game data or converted textures failed verification" >&2
            exit 1
        }
        KZ_LAUNCH_PREFIX=("$KZ_ROOT/scripts/lib/kz-lock" --shared "${lock[@]}" --)
        return 0
    fi
    # A cheap source metadata check skips extraction when this source and data version are current.
    # An explicit dc2data check still performs the full output hash audit.
    local extract=("$KZ_BUILD_DIR/dc2data" extract "$source" "$data_root")
    mkdir -p .kazarov/locks
    if "$KZ_ROOT/scripts/lib/kz-lock" --shared "${lock[@]}" -- \
        "$KZ_BUILD_DIR/dc2data" current "$source" "$data_root"; then
        KZ_LAUNCH_PREFIX=("$KZ_ROOT/scripts/lib/kz-lock" --shared "${lock[@]}" --)
        return 0
    fi
    "$KZ_ROOT/scripts/lib/kz-lock" "${lock[@]}" -- "${extract[@]}" || {
        echo "kazarov: extracting the PAL data failed" >&2
        exit 1
    }
    KZ_LAUNCH_PREFIX=("$KZ_ROOT/scripts/lib/kz-lock" --shared "${lock[@]}" --)
}
