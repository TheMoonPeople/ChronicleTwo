name: Compiler integration

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Reuse the image loaded by BuildKit even when the runner also provides Podman.
      BUILDER: docker
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true

      - name: Identify the toolchain image
        id: image
        run: echo "tag=$(git -C tools/kazarov rev-parse HEAD:image HEAD:tools/ffmpeg HEAD:.dockerignore | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build toolchain image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: tools/kazarov
          file: tools/kazarov/image/Dockerfile
          load: true
          tags: kazarov-dev:${{ steps.image.outputs.tag }}
          build-args: KZ_IMAGE_ID=${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=ci-ps2
          cache-to: type=gha,mode=max,scope=ci-ps2,ignore-error=true

      - name: Test verified dependency acquisition
        run: tools/kazarov/scripts/kazarov shell /usr/bin/python3 -m pytest tools/kazarov/tests/test_kz_ffmpeg.py -q

      - name: Test pinned compiler hooks
        run: |
          tools/kazarov/scripts/kazarov shell sh -ec '
            export SATANSFIDDLE_TEST_COMPILER_300=/work/chronicletwo/tools/compilers/mw/3.0-011126/mwccps2.exe
            export SATANSFIDDLE_TEST_EXECUTABLE=/usr/local/bin/satansfiddle
            export SATANSFIDDLE_TEST_FAULT_EXECUTABLE=/usr/local/libexec/satansfiddle-tests/satansfiddle-fault-test
            /usr/local/libexec/satansfiddle-tests/compiler_cli-* \
              --ignored --skip real_compilers_repeatability_float_policies_and_failure \
              --test-threads=1
          '

      - name: Test object and profile verification
        run: |
          tools/kazarov/scripts/kazarov shell sh -ec '
            python3 -m unittest discover -s scripts/build -p "test_*.py"
          '
