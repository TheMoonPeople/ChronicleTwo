name: Dependency bundle
on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: true
      artifact:
        type: string
        required: true
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          persist-credentials: false
      - name: Check dependency stage ordering
        run: python3 tools/ci/test_dockerfile.py
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: bundle
        with:
          path: .kazarov/bundle
          key: deps-v2-${{ inputs.platform }}-${{ hashFiles('tools/ci/Dockerfile*', 'port/CMakeLists.txt', 'port/cmake/**', 'port/src/tests/CMakeLists.txt', 'tools/kazarov/cmake/**', 'tools/kazarov/Cargo.toml', 'tools/kazarov/Cargo.lock', 'tools/kazarov/tools/ffmpeg/kz-ffmpeg') }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.bundle.outputs.cache-hit != 'true'
      - name: Build the verified dependency bundle
        if: steps.bundle.outputs.cache-hit != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: tools/ci/Dockerfile
          target: ${{ inputs.platform }}-bundle
          outputs: type=local,dest=.kazarov/export
          cache-from: type=gha,scope=deps-${{ inputs.platform }}
          cache-to: type=gha,mode=max,scope=deps-${{ inputs.platform }},ignore-error=true
      - name: Collect the dependency bundle
        if: steps.bundle.outputs.cache-hit != 'true'
        run: |
          mkdir -p .kazarov/bundle
          mv .kazarov/export/deps.tar.gz .kazarov/export/deps.sha256 .kazarov/bundle/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.artifact }}
          path: .kazarov/bundle/*
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
