name: Linux
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      tests:
        type: boolean
        default: false
      sanitizers:
        type: string
        default: none
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.tests || false }}-linux-${{ inputs.sanitizers || 'none' }}
  cancel-in-progress: true
jobs:
  build:
    name: Tests (Linux, ${{ inputs.sanitizers || 'none' }})
    if: inputs.tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CT_CACHE_PROFILE: ${{ inputs.sanitizers && inputs.sanitizers != 'none' && format('{0}-', inputs.sanitizers) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          fetch-depth: ${{ inputs.tests && '0' || '1' }}
      - name: Check dependency stage ordering
        run: python3 tools/ci/test_dockerfile.py
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: compile-cache
        with:
          path: |
            .kazarov/ccache/linux
            .kazarov/mesa-cache/linux
            .kazarov/cargo-target/linux
            port/build/pc*/cargo
          key: compile-linux-${{ env.CT_CACHE_PROFILE }}${{ inputs.tests && 'tests' || 'build' }}-${{ hashFiles('tools/ci/Dockerfile', 'tools/kazarov/Cargo.lock', 'tools/kazarov/tools/ffmpeg/kz-ffmpeg') }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            compile-linux-${{ env.CT_CACHE_PROFILE }}${{ inputs.tests && 'tests' || 'build' }}-${{ hashFiles('tools/ci/Dockerfile', 'tools/kazarov/Cargo.lock', 'tools/kazarov/tools/ffmpeg/kz-ffmpeg') }}-${{ github.sha }}-
            compile-linux-${{ env.CT_CACHE_PROFILE }}${{ inputs.tests && 'tests' || 'build' }}-${{ hashFiles('tools/ci/Dockerfile', 'tools/kazarov/Cargo.lock', 'tools/kazarov/tools/ffmpeg/kz-ffmpeg') }}-
            compile-linux-${{ env.CT_CACHE_PROFILE }}${{ inputs.tests && 'build' || 'tests' }}-${{ hashFiles('tools/ci/Dockerfile', 'tools/kazarov/Cargo.lock', 'tools/kazarov/tools/ffmpeg/kz-ffmpeg') }}-
            compile-linux-${{ env.CT_CACHE_PROFILE }}tests-
            compile-linux-${{ env.CT_CACHE_PROFILE }}build-
      - name: Rebuild Rust outputs after dependency changes
        env:
          RESTORED_CACHE_KEY: ${{ steps.compile-cache.outputs.cache-matched-key }}
          DEPENDENCY_CACHE_PREFIX: |
            compile-linux-${{ env.CT_CACHE_PROFILE }}tests-${{ hashFiles('tools/ci/Dockerfile', 'tools/kazarov/Cargo.lock', 'tools/kazarov/tools/ffmpeg/kz-ffmpeg') }}-
            compile-linux-${{ env.CT_CACHE_PROFILE }}build-${{ hashFiles('tools/ci/Dockerfile', 'tools/kazarov/Cargo.lock', 'tools/kazarov/tools/ffmpeg/kz-ffmpeg') }}-
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import shutil
          key = os.environ['RESTORED_CACHE_KEY']
          prefixes = tuple(os.environ['DEPENDENCY_CACHE_PREFIX'].splitlines())
          if key and not key.startswith(prefixes):
              workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve()
              targets = [workspace / ".kazarov/cargo-target/linux", workspace / "port/build/pc/cargo", workspace / "port/build/pc-asan/cargo"]
              if any(target.resolve() != target or not target.resolve().is_relative_to(workspace) for target in targets):
                  raise SystemExit('Rust cache paths must be real directories inside the workspace')
              for target in targets:
                  if target.exists():
                      shutil.rmtree(target)
              print('Dependency inputs changed; cached Rust outputs will be rebuilt.')
          PY
      - name: Prepare the build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: tools/ci/Dockerfile
          target: linux
          load: true
          tags: chronicletwo-ci:build
          cache-from: type=gha,scope=ci-linux
          cache-to: type=gha,mode=max,scope=ci-linux,ignore-error=true
      - name: ${{ inputs.tests && 'Build and test' || 'Build and package' }}
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CT_SANITIZERS: ${{ inputs.sanitizers || 'none' }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" \
            -e PR_BASE -e BEFORE -e EVENT -e DEFAULT_BRANCH -e CT_SANITIZERS \
            chronicletwo-ci:build bash tools/ci/linux.sh ${{ inputs.tests && 'tests' || 'build' }}
      - name: Restore cache ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .kazarov port/build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && inputs.tests
        with:
          name: tests-linux-${{ inputs.sanitizers || 'none' }}
          path: |
            port/build/pc*/tests.xml
            port/build/pc*/Testing/Temporary/
          if-no-files-found: warn

      - name: Save reusable compiler outputs
        if: always() && steps.compile-cache.outputs.cache-primary-key != '' && steps.compile-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .kazarov/ccache/linux
            .kazarov/mesa-cache/linux
            .kazarov/cargo-target/linux
            port/build/pc*/cargo
          key: ${{ steps.compile-cache.outputs.cache-primary-key }}

  # docs/FLATPAK.md: the Linux build packaged in Flathub's freedesktop 26.08 image. The manifest uses the
  # commit under test as a git source.
  flatpak:
    name: Build the Flatpak (Linux x86_64)
    if: ${{ !inputs.tests }}
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08@sha256:6ed6921bb5a9e1a916989971844f159b854b7b225880c381fa34f7a158863039
      options: --privileged
    env:
      MANIFEST: port/flatpak/ci.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - name: Check that the vendored crates match Kazarov's Cargo.lock
        run: |
          # The workspace belongs to another user in the container, which git refuses until it is marked safe.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 port/flatpak/cargo_sources.py
          git diff --exit-code port/flatpak/cargo-sources.json

      - name: Point the manifest at this commit
        run: |
          awk -v commit="$GITHUB_SHA" '
            /# chronicletwo-source:/ {
              print
              print "      - type: git"
              print "        path: ../.."
              print "        commit: " commit
              skip = 1
              next
            }
            /# chronicletwo-source-end/ { skip = 0 }
            !skip { print }
          ' port/flatpak/org.themoonpeople.ChronicleTwo.yml > "$MANIFEST"
          sed -n '/name: chronicletwo$/,$p' "$MANIFEST" | head -80

      - name: Restore Flatpak sources and build outputs
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: flatpak-cache
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ hashFiles('port/flatpak/org.themoonpeople.ChronicleTwo.yml', 'port/flatpak/cargo-sources.json') }}-${{ github.sha }}-${{ github.run_attempt }}-x86_64
          restore-keys: |
            flatpak-builder-${{ hashFiles('port/flatpak/org.themoonpeople.ChronicleTwo.yml', 'port/flatpak/cargo-sources.json') }}-

      - name: Download and verify Flatpak dependencies
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            if flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo && \
              flatpak-builder --download-only --install-deps-from=flathub \
                --disable-rofiles-fuse --force-clean --arch=x86_64 \
                --state-dir=.flatpak-builder flatpak_app "$MANIFEST"; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Flatpak dependency downloads failed after four attempts." >&2
              exit 1
            fi
            echo "Retrying Flatpak dependency downloads after attempt $attempt."
            sleep "$((attempt * 5))"
          done

      - uses: flatpak/flatpak-github-actions/flatpak-builder@0fadf5d65cdfbdb9c94c7a2f3637c41206cc1a70 # v6
        with:
          manifest-path: ${{ env.MANIFEST }}
          bundle: chronicletwo.flatpak
          artifact-name: chronicletwo-x86_64.flatpak
          restore-cache: false
          save-cache: ${{ steps.flatpak-cache.outputs.cache-hit != 'true' }}
          cache-key: flatpak-builder-${{ hashFiles('port/flatpak/org.themoonpeople.ChronicleTwo.yml', 'port/flatpak/cargo-sources.json') }}-${{ github.sha }}-${{ github.run_attempt }}

      # The packaged darkchronicle keeps its line tables (the manifest sets no-debuginfo), so it is its own
      # symbol file for tools/crash/symbolize.py.
      - name: Upload the Flatpak symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: chronicletwo-flatpak-x86_64-symbols-${{ github.sha }}
          path: flatpak_app/files/bin/darkchronicle
          if-no-files-found: error
