name: PC builds

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Lavapipe renders on the CPU, so the unit tests' per-case limit is widened from its 5 second default.
      - name: Configure
        run: tools/kazarov/scripts/kazarov shell cmake --preset linux-x64 -DCT_TEST_TIMEOUT=60

      - name: Build
        run: ./build.sh linux-x64

      # Truncations.Check and Records.Check exit 77 (SKIPPED) without the clang bindings, and a skip passes CI silently.
      - name: Check that the pointer checks can run
        run: tools/kazarov/scripts/kazarov shell python3 -c "import clang.cindex"

      - name: Test
        run: tools/kazarov/scripts/kazarov shell ctest --test-dir port/build/pc --output-on-failure -j4

      - name: Test Rust data publisher
        run: tools/kazarov/scripts/kazarov shell cargo test --locked --manifest-path tools/kazarov/Cargo.toml

      # The VU1 programs are native: their packed CPU halves live only in the test oracles.
      - name: Check that no PS2 packing or VU1 layout helper is in the runtime
        run: tools/kazarov/scripts/kazarov shell python3 scripts/port/native_gate.py --binary port/build/pc/darkchronicle

      # A non-PIE link places the game below 4 GiB, where a pointer truncated to 32 bits still works and hides the bug.
      - name: Check that darkchronicle is position-independent
        run: |
          tools/kazarov/scripts/kazarov shell bash -c "llvm-readobj --file-headers port/build/pc/darkchronicle | grep -q 'Type: SharedObject'"

  macos:
    name: Build and test (macOS arm64)
    runs-on: macos-26
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      # These 14 rendering tests read back black frames or wrong pixels only on the hosted runner's virtual
      # GPU (Apple Paravirtual device under MoltenVK). The same test binary passes all 14 on Apple Silicon
      # hardware (M3, macOS 27.0.1, MoltenVK 1.4.2), and Linux CI gates them on lavapipe. They are reported
      # here without failing the job; remove this once the runner's GPU renders them correctly.
      MACOS_GPU_REPORT_ONLY: >-
        ^(MgDrawPrimRender\.LinearAtlasCellsKeepTopOutlinesWithoutSamplingTheNextCell|MgShadow\.OverlappingCastersShadeTheirUnionNotTheirSum|MgVisual\.DrawManagerPathMatchesDirect|MgVisual\.DirectMaterialUsesItsOwnTextureWrap|MgVisual\.QueuedMaterialRetainsItsOwnTextureWrap|MglibAspect\.MenuFormsHideParkedStatsWithoutClippingEnteringPanel|MglibPresent\.BackBufferCapturePreservesWidePixelsAndHoldsUntilRecaptured|MglibSeam\.ReusedTextureKeyDoesNotSampleRetiredRenderTarget|MenuIconGpu\.ItemDrawSamplesSelectedAtlasCellsInCanonicalAndDisplayFrames|MenuIconGpu\.EffectUsesSelectedBakedRgbaAtlasAndRestoresNormally|MgTextureGpu\.HighResolutionKeepsLogicalCpuStrideAndSpriteBounds|GfxGpuMeshDc2\.RefSphere|GfxGpuMeshDc2\.Prog0CullModeFollowsFlagAndMirror|GfxGpuDisplayList\.PresentationCompositeDoesNotWriteTransparentDepth)$
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install the toolchain and libraries
        run: |
          brew install llvm lld cmake ninja python glslang sdl3 vulkan-headers vulkan-loader vulkan-tools molten-vk \
            googletest nlohmann-json
          rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
          rustup default 1.99.0
          cargo install cxxbridge-cmd --version 1.0.205 --locked
          # SDL loads the Vulkan loader by name, and dyld does not search Homebrew's prefix.
          echo "SDL_VULKAN_LIBRARY=$(brew --prefix vulkan-loader)/lib/libvulkan.1.dylib" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$(brew --prefix)/etc/vulkan/icd.d/MoltenVK_icd.json" >> "$GITHUB_ENV"

      - name: Describe the Vulkan driver
        run: |
          mkdir -p artifacts
          vulkaninfo --summary > artifacts/vulkaninfo.txt 2>&1 || true
          cat artifacts/vulkaninfo.txt

      - name: Build the minimal LGPL FFmpeg
        run: tools/kazarov/scripts/build/kz-ffmpeg --out .kazarov/ffmpeg/darwin-arm64

      - name: Configure
        run: cmake --preset macos-arm64 -DCT_TEST_TIMEOUT=60

      - name: Build
        run: cmake --build --preset macos-arm64

      - name: Test
        run: ctest --preset macos-arm64 -E "$MACOS_GPU_REPORT_ONLY"

      - name: Test cases the hosted runner's virtual GPU renders wrongly (report only)
        continue-on-error: true
        run: ctest --preset macos-arm64 -R "$MACOS_GPU_REPORT_ONLY"

      - name: Test Rust data publisher
        run: cargo test --locked --manifest-path tools/kazarov/Cargo.toml

      - name: Package the macOS build
        run: tar -czf artifacts/chronicletwo-macos-arm64.tar.gz -C port/build/macos-arm64 darkchronicle

      - name: Upload the macOS build
        uses: actions/upload-artifact@v7
        with:
          name: chronicletwo-macos-arm64
          path: artifacts/chronicletwo-macos-arm64.tar.gz
          if-no-files-found: error

      - name: Upload the Vulkan description
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos
          path: artifacts/vulkaninfo.txt
          if-no-files-found: warn

  windows:
    name: Build and test (Windows x64)
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Runtime DLLs, including the Vulkan loader, are acquired and bundled by default.
      - name: Install the toolchain and libraries
        run: |
          ./tools/windows/acquire.ps1 -Root $env:RUNNER_TEMP

      - name: Configure
        run: |
          ./tools/windows/configure.ps1 -Root $env:RUNNER_TEMP -BuildDirectory $env:GITHUB_WORKSPACE/port/build/windows-x64-tests -Tests

      - name: Build
        run: |
          ./tools/windows/build.ps1 -Root $env:RUNNER_TEMP -BuildDirectory $env:GITHUB_WORKSPACE/port/build/windows-x64-tests -Tests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # The runner has no Vulkan device, so cases labelled gpu are excluded.
      - name: Test
        run: ctest --test-dir port/build/windows-x64-tests --output-on-failure -j4 -LE gpu

      - name: Test Rust data publisher
        run: |
          $env:CARGO_HOME = "$env:RUNNER_TEMP/deps/rust/cargo-home"
          $rust = "$env:RUNNER_TEMP/deps/rust/1.99.0-gnullvm/bin"
          $llvm = "$env:RUNNER_TEMP/deps/llvm/llvm-mingw-20260922-ucrt-x86_64/bin"
          $env:PATH = "$rust;$llvm;$env:PATH"
          & "$rust/cargo.exe" test --locked --manifest-path tools/kazarov/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Package the Windows build
        run: |
          ./tools/windows/package.ps1 -BuildDirectory port/build/windows-x64-tests -Destination chronicletwo-windows-x64.zip

      - name: Upload the Windows build
        uses: actions/upload-artifact@v7
        with:
          name: chronicletwo-windows-x64
          path: chronicletwo-windows-x64.zip
          if-no-files-found: error

  # docs/FLATPAK.md: the Linux build packaged in Flathub's freedesktop 26.08 image. The manifest uses the
  # commit under test as a git source, and the smoke run checks that the packaged binary reaches its data check.
  flatpak:
    name: Build the Flatpak (Linux x86_64)
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    env:
      MANIFEST: port/flatpak/ci.yml
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Check that the vendored crates match Kazarov's Cargo.lock
        run: |
          # The workspace belongs to another user in the container, which git refuses until it is marked safe.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 port/flatpak/cargo_sources.py
          git diff --exit-code port/flatpak/cargo-sources.json

      - name: Point the manifest at this commit
        run: |
          awk -v commit="$GITHUB_SHA" '
            /# chronicletwo-source:/ {
              print
              print "      - type: git"
              print "        path: ../.."
              print "        commit: " commit
              skip = 1
              next
            }
            /# chronicletwo-source-end/ { skip = 0 }
            !skip { print }
          ' port/flatpak/org.themoonpeople.ChronicleTwo.yml > "$MANIFEST"
          sed -n '/name: chronicletwo$/,$p' "$MANIFEST" | head -80

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: ${{ env.MANIFEST }}
          bundle: chronicletwo.flatpak
          artifact-name: chronicletwo-x86_64.flatpak
          cache-key: flatpak-builder-${{ hashFiles('port/flatpak/org.themoonpeople.ChronicleTwo.yml', 'port/flatpak/cargo-sources.json') }}

      - name: Start darkchronicle without data
        run: |
          set +e
          flatpak build --env=XDG_DATA_HOME=/tmp/xdg flatpak_app darkchronicle --headless --frames 1 > run.txt 2>&1
          status=$?
          cat run.txt
          echo "darkchronicle exited $status"
          [ "$status" -eq 3 ] && grep -q 'No current Dark Chronicle data at /tmp/xdg/chronicletwo/data' run.txt
