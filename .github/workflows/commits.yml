name: Commit notifications

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  discord:
    runs-on: ubuntu-latest
    env:
      HAS_DISCORD: ${{ secrets.DISCORD_COMMITS_WEBHOOK_URL != '' }}
    steps:
      - name: Check out source
        if: env.HAS_DISCORD == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Prepare commit message
        if: env.HAS_DISCORD == 'true'
        run: |
          python3 .github/scripts/discord_commits.py \
            --event "$GITHUB_EVENT_PATH" \
            "$RUNNER_TEMP/discord-commits.json"

      - name: Send commits to Discord
        if: env.HAS_DISCORD == 'true'
        shell: pwsh
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_COMMITS_WEBHOOK_URL }}
        run: |
          Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK_URL -Method Post `
            -ContentType 'application/json' -InFile "$env:RUNNER_TEMP/discord-commits.json" `
            -MaximumRetryCount 3 -RetryIntervalSec 1 -ErrorAction Stop
