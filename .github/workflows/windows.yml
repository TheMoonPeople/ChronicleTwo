name: Windows
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      tests:
        type: boolean
        default: true
  workflow_call:
    inputs:
      tests:
        type: boolean
        default: false
permissions:
  contents: read
env:
  RUN_TESTS: ${{ inputs.tests || github.event_name == 'push' || github.event_name == 'pull_request' }}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.tests || false }}-windows
  cancel-in-progress: true
jobs:
  build:
    name: Cross compile (Windows)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: compile-cache
        with:
          path: |
            .kazarov/ccache/windows-cross
            .kazarov/cargo-target/windows-cross
            port/build/windows-cross-x64-release/cargo
            port/build/windows-cross-x64-release/lto-cache
          key: compile-windows-cross-${{ hashFiles('tools/ci/Dockerfile', 'tools/ci/windows-toolchain.cmake', 'tools/kazarov/Cargo.lock', 'tools/kazarov/tools/ffmpeg/kz-ffmpeg') }}-${{ env.RUN_TESTS == 'true' && 'tests' || 'build' }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            compile-windows-cross-${{ hashFiles('tools/ci/Dockerfile', 'tools/ci/windows-toolchain.cmake', 'tools/kazarov/Cargo.lock', 'tools/kazarov/tools/ffmpeg/kz-ffmpeg') }}-${{ env.RUN_TESTS == 'true' && 'tests' || 'build' }}-${{ github.sha }}-
            compile-windows-cross-${{ hashFiles('tools/ci/Dockerfile', 'tools/ci/windows-toolchain.cmake', 'tools/kazarov/Cargo.lock', 'tools/kazarov/tools/ffmpeg/kz-ffmpeg') }}-${{ env.RUN_TESTS == 'true' && 'tests' || 'build' }}-
            compile-windows-cross-${{ hashFiles('tools/ci/Dockerfile', 'tools/ci/windows-toolchain.cmake', 'tools/kazarov/Cargo.lock', 'tools/kazarov/tools/ffmpeg/kz-ffmpeg') }}-
            compile-windows-cross-
      - name: Rebuild Rust outputs after dependency changes
        env:
          RESTORED_CACHE_KEY: ${{ steps.compile-cache.outputs.cache-matched-key }}
          DEPENDENCY_CACHE_PREFIX: compile-windows-cross-${{ hashFiles('tools/ci/Dockerfile', 'tools/ci/windows-toolchain.cmake', 'tools/kazarov/Cargo.lock', 'tools/kazarov/tools/ffmpeg/kz-ffmpeg') }}-
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import shutil
          key = os.environ['RESTORED_CACHE_KEY']
          prefixes = tuple(os.environ['DEPENDENCY_CACHE_PREFIX'].splitlines())
          if key and not key.startswith(prefixes):
              workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve()
              targets = [workspace / ".kazarov/cargo-target/windows-cross", workspace / "port/build/windows-cross-x64-release/cargo"]
              if any(target.resolve() != target or not target.resolve().is_relative_to(workspace) for target in targets):
                  raise SystemExit('Rust cache paths must be real directories inside the workspace')
              for target in targets:
                  if target.exists():
                      shutil.rmtree(target)
              print('Dependency inputs changed; cached Rust outputs will be rebuilt.')
          PY
      - name: Prepare the LLVM cross compiler
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: tools/ci/Dockerfile
          target: windows
          load: true
          tags: chronicletwo-ci:windows
          cache-from: type=gha,scope=ci-windows
          cache-to: type=gha,mode=max,scope=ci-windows,ignore-error=true
      - name: Build Windows executables
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" \
            chronicletwo-ci:windows bash tools/ci/windows.sh ${{ env.RUN_TESTS == 'true' && 'tests' || 'build' }}
      - name: Package Windows executables
        run: docker run --rm -v "$GITHUB_WORKSPACE:/work" chronicletwo-ci:windows python3 tools/ci/windows-package.py ${{ env.RUN_TESTS == 'true' && 'tests' || 'build' }}
      - name: Restore cache ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .kazarov port/build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: chronicletwo-windows-x64
          path: artifacts/chronicletwo-windows-x64.zip
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: env.RUN_TESTS == 'true'
        with:
          name: windows-test-binaries
          path: artifacts/windows-test-binaries.zip
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: chronicletwo-windows-x64-symbols-${{ github.sha }}
          path: artifacts/chronicletwo-windows-x64-symbols.zip
          compression-level: 0
          if-no-files-found: error
      - name: Save reusable compiler outputs
        if: always() && steps.compile-cache.outputs.cache-primary-key != '' && steps.compile-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .kazarov/ccache/windows-cross
            .kazarov/cargo-target/windows-cross
            port/build/windows-cross-x64-release/cargo
            port/build/windows-cross-x64-release/lto-cache
          key: ${{ steps.compile-cache.outputs.cache-primary-key }}

  test:
    name: Tests (Windows)
    if: inputs.tests || github.event_name == 'push' || github.event_name == 'pull_request'
    needs: build
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: windows-test-binaries
          path: artifacts
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.10'
      - name: Prepare tests for the Windows runner
        shell: pwsh
        run: |
          Expand-Archive artifacts/windows-test-binaries.zip port/build/windows-cross-x64-release
          # Compiled fixture paths use the container's /work prefix on the current drive.
          $work = Join-Path ([IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE)) 'work'
          New-Item -ItemType Junction -Path $work -Target $env:GITHUB_WORKSPACE | Out-Null
          python tools/ci/windows-package.py relocate
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Run native Windows tests
        run: ctest --test-dir port/build/windows-cross-x64-release --output-on-failure --no-tests=error --output-junit tests.xml -j4 -LE gpu
      - name: Test Rust data publisher
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem port/build/windows-cross-x64-release/rust-tests/*.exe | Where-Object Name -ne 'ffmpeg.exe')
          if (!$tests.Count) { throw 'No cross-compiled Rust tests were packaged' }
          foreach ($test in $tests) {
            & $test.FullName
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: tests-windows
          path: |
            port/build/windows-cross-x64-release/tests.xml
            port/build/windows-cross-x64-release/Testing/Temporary/
          if-no-files-found: warn
