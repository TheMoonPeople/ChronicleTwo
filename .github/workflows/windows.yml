name: Windows
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      tests:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.tests || false }}-windows
  cancel-in-progress: true
jobs:
  dependencies:
    uses: ./.github/workflows/dependencies.yml
    with:
      platform: windows
      artifact: windows-dependencies
  build:
    name: ${{ inputs.tests && 'Tests (Windows)' || 'Build (Windows)' }}
    needs: dependencies
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.kazarov/cargo-target/windows
      CCACHE_DIR: ${{ github.workspace }}/.kazarov/ccache/windows
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/download-artifact@v7
        with:
          name: windows-dependencies
          path: .kazarov/bundle
      - name: Unpack verified dependencies
        run: |
          $archive = '.kazarov/bundle/deps.tar.gz'
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($actual -ne (Get-Content .kazarov/bundle/deps.sha256).Trim()) { throw 'Dependency bundle checksum mismatch' }
          tar -xzf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "$env:RUNNER_TEMP/deps/cmake/cmake-4.4.5-windows-x86_64/bin" >> $env:GITHUB_PATH
          "$env:RUNNER_TEMP/deps/python" >> $env:GITHUB_PATH
          "CMAKE_BUILD_PARALLEL_LEVEL=$([Environment]::ProcessorCount)" >> $env:GITHUB_ENV
          "CARGO_BUILD_JOBS=$([Environment]::ProcessorCount)" >> $env:GITHUB_ENV
      - uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/deps/rust/cargo-home
            .kazarov/cargo-target/windows
            .kazarov/ccache/windows
            port/build/windows-x64-release/lto-cache
          key: compile-windows-${{ hashFiles('tools/ci/Dockerfile', 'tools/kazarov/Cargo.lock') }}-${{ inputs.tests && 'tests' || 'build' }}-${{ github.sha }}
          restore-keys: |
            compile-windows-${{ hashFiles('tools/ci/Dockerfile', 'tools/kazarov/Cargo.lock') }}-${{ inputs.tests && 'tests' || 'build' }}-
            compile-windows-${{ hashFiles('tools/ci/Dockerfile', 'tools/kazarov/Cargo.lock') }}-

      - name: Configure
        run: |
          ./tools/windows/configure.ps1 -Root $env:RUNNER_TEMP -BuildDirectory $env:GITHUB_WORKSPACE/port/build/windows-x64-release -Tests:$${{ inputs.tests && 'true' || 'false' }} -BuildType Release -TestTimeout 60 -Symbols split

      - name: Build
        run: |
          ./tools/windows/build.ps1 -Root $env:RUNNER_TEMP -BuildDirectory $env:GITHUB_WORKSPACE/port/build/windows-x64-release -Tests:$${{ inputs.tests && 'true' || 'false' }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # The runner has no Vulkan device, so cases labelled gpu are excluded.
      - name: Test
        if: inputs.tests
        run: ctest --test-dir port/build/windows-x64-release --output-on-failure --no-tests=error --output-junit tests.xml -j4 -LE gpu

      - name: Test Rust data publisher
        if: inputs.tests
        run: |
          $env:CARGO_HOME = "$env:RUNNER_TEMP/deps/rust/cargo-home"
          $rust = "$env:RUNNER_TEMP/deps/rust/1.99.0-gnullvm/bin"
          $llvm = "$env:RUNNER_TEMP/deps/llvm/llvm-mingw-20260922-ucrt-x86_64/bin"
          $env:PATH = "$rust;$llvm;$env:PATH"
          & "$rust/cargo.exe" test --locked --manifest-path tools/kazarov/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Package the Windows build
        if: ${{ !inputs.tests }}
        run: |
          ./tools/windows/package.ps1 -BuildDirectory port/build/windows-x64-release -Destination chronicletwo-windows-x64.zip

      - name: Upload the Windows build
        if: ${{ !inputs.tests }}
        uses: actions/upload-artifact@v7
        with:
          name: chronicletwo-windows-x64
          path: chronicletwo-windows-x64.zip
          if-no-files-found: error

      - name: Check the executable resolves a frame
        if: inputs.tests
        run: |
          $llvm = "$env:RUNNER_TEMP/deps/llvm/llvm-mingw-20260922-ucrt-x86_64/bin"
          $exe = 'port/build/windows-x64-release/darkchronicle.exe'
          $address = (& "$llvm/llvm-nm.exe" $exe | Where-Object { $_ -match ' T wmain$' }).Split(' ')[0]
          '#0  darkchronicle.exe+0x{0:x}' -f ([Convert]::ToUInt64($address, 16) - 0x140000000) | Set-Content report.txt
          python tools/crash/symbolize.py report.txt --binary $exe --llvm-symbolizer "$llvm/llvm-symbolizer.exe" | Tee-Object symbolized.txt
          if (!(Select-String -Quiet -Path symbolized.txt -Pattern 'main.cpp:')) { exit 1 }

      # docs/SYMBOLS.md: the executables (their DWARF), any PDBs and their build ids, for tools/crash/symbolize.py.
      - name: Package the Windows symbols
        if: ${{ !inputs.tests }}
        run: |
          ./tools/windows/package-symbols.ps1 -Root $env:RUNNER_TEMP -BuildDirectory port/build/windows-x64-release -Destination chronicletwo-windows-x64-symbols.zip

      - name: Upload the Windows symbols
        if: ${{ !inputs.tests }}
        uses: actions/upload-artifact@v7
        with:
          name: chronicletwo-windows-x64-symbols-${{ github.sha }}
          path: chronicletwo-windows-x64-symbols.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always() && inputs.tests
        with:
          name: tests-windows
          path: |
            port/build/windows-x64-release/tests.xml
            port/build/windows-x64-release/Testing/Temporary/
          if-no-files-found: warn
