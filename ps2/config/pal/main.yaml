# The main image, as splat splits it.
name: main
sha1: 32d26ba8e132a6b65f53212c89803903d0ad7f4d
options:
  platform: ps2
  compiler: MWCCPS2
  basename: main
  base_path: ../../..
  target_path: rom/pal/extracted/iso/SCES_511.90
  asm_path: ps2/asm/pal
  src_path: ps2/src
  build_path: build/pal/splat/main
  ld_script_path: build/pal/splat/main.ld
  symbol_addrs_path: [ps2/config/pal/main.symbols.txt]
  undefined_syms_auto_path: build/pal/splat/main.undefined_syms.txt
  undefined_funcs_auto_path: build/pal/splat/main.undefined_funcs.txt

  mips_abi_gpr: numeric
  asm_data_macro: glabel
  asm_end_label: ""
  asm_data_end_label: ""
  asm_nonmatching_label_macro: ""
  rom_address_padding: True
  create_data_pads: False
  create_bss_pads: True

  # A wrong guess makes the build non-matching, so nothing is guessed.
  rodata_string_guesser_level: 0
  data_string_guesser_level: 0
  find_file_boundaries: False

  # Every datum is a marker of its own in the unit's source, constants
  # included, so none travels inside a function's file.
  migrate_rodata_to_functions: False
  # Every reference file has to assemble on its own, so each carries
  # macro.inc; including it twice is harmless.
  generated_s_preamble: ".include \"macro.inc\""
  asm_inc_header: ".include \"macro.inc\"\n\n.set noat\n.set noreorder\n\n"
  create_c_files: False
  # tools/splat_ext/sinit.py: a unit's `__sinit_<file>.cpp` function, which
  # MWCC emits into `.init` rather than `.text`.
  extensions_path: tools/splat_ext
  # ps2/include/macro.inc is written by hand: its `alabel` is
  # deliberately not global, because a branch to a global label becomes
  # a relocation mwld and gas disagree about. splat's generated one
  # makes it global, so it must not overwrite this project's.
  generate_asm_macros_files: False
  do_c_func_detection: True
  disassemble_all: True
  make_full_disasm_for_code: True
  section_order: [".text", ".data", ".rodata", ".init", ".ctor", ".vtables", ".rdata", ".sdata", ".sbss", ".bss"]

segments:
  # Units are in link order. crt0, the Metrowerks runtime (lib/mwcc) and the
  # SDK, libc, libm and libgcc objects (lib/...) come from libraries and are
  # linked from their split assembly (`asmtu`); the rest is the game, compiled
  # by MWCC from ps2/src (`cpp`). A game unit named by a
  # `__sinit_<name>.cpp` symbol carries that name; the others are named for
  # what they hold.
  #
  # Every unit's sections carry its name: `.data`, `.rodata`, `.sdata`,
  # `.sbss` and `.bss`, the static initialiser (`.sinit`, linked as `.init`),
  # its entry in the `__static_init` table (`.ctor`) and its vtables
  # (`.vtables`). splat writes them all into the unit's one file.
  - name: main
    type: code
    start: 0x80
    vram: 0x100000
    bss_size: 0x1be7c80
    subsegments:
      - {start: 0x80, type: asmtu, name: crt0}
      - {start: 0x150, type: cpp, name: lib/mwcc/fpcmp}
